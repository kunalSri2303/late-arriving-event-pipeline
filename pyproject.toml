[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "late-arriving-event-pipeline"
version = "0.1.0"
description = "Late-Arriving Event Pipeline with historical aggregate correction and reconciliation (Bytespoke DAI-040)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
